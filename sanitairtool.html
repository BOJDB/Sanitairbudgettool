<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanitair samenstellen</title>
<style>
  /* Huisstijl Jouw Droombadkamer, juli 2025 */
  :root {
    --geel: #FFCD01;
    --geel-tint: #FFF6D2;
    --zwart: #000000;
    --donkergrijs: #3C3A35;
    --blauwgrijs: #E5E7EB;
    --lichtgrijs: #F7F8FA;
    --lichtcreme: #F3F1EC;
    --lijn: #E5E7EB;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 20px 16px 40px;
    /* Museo Sans wordt gebruikt als die op het apparaat staat, anders een
       geometrische schreefloze die er dicht bij komt. */
    font-family: "Museo Sans", "Museo Sans 300", "Museo Sans Rounded",
                 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--lichtgrijs);
    color: var(--donkergrijs);
    line-height: 1.45;
  }
  .app { max-width: 640px; margin: 0 auto; }

  .merkbalk {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .merkbalk .logobeeld { flex: none; height: 46px; width: auto; }
  .merkbalk .woordmerk {
    font-weight: 800; letter-spacing: .01em; line-height: 1;
    font-size: 15px; text-transform: uppercase; color: var(--zwart);
  }
  .merkbalk .woordmerk span { display: block; }

  h1 { font-size: 26px; line-height: 1.1; margin: 0 0 6px; letter-spacing: -.02em; color: var(--zwart); font-weight: 700; }
  .ondertitel { font-size: 14px; color: var(--donkergrijs); margin: 0 0 20px; }

  .rail { display: flex; gap: 4px; margin-bottom: 14px; }
  .rail i { flex: 1; height: 4px; border-radius: 2px; background: var(--blauwgrijs); }
  .rail i.done { background: var(--geel); }

  .box {
    background: #fff; border-radius: 14px; padding: 22px 20px 24px;
    box-shadow: 0 1px 2px rgba(60,58,53,.08);
  }
  .stapnr { font-size: 12px; color: #8b9295; margin-bottom: 3px; }
  h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; color: var(--zwart); font-weight: 700; }
  .uitleg { font-size: 13px; color: #6f7679; margin: 0 0 18px; }

  fieldset { border: 0; padding: 0; margin: 0 0 20px; }
  fieldset:last-of-type { margin-bottom: 0; }
  legend {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    font-weight: 700; color: var(--zwart); padding: 0 0 0 12px; margin-bottom: 9px;
    border-left: 4px solid var(--geel);
  }

  label.keuze {
    display: flex; align-items: flex-start; gap: 12px;
    border: 1.5px solid var(--lijn); border-radius: 10px;
    padding: 13px 14px; margin-bottom: 8px; background: #fff; cursor: pointer;
  }
  label.keuze.aan { border-color: var(--geel); background: var(--geel-tint); }
  label.keuze.uit { opacity: .5; cursor: default; background: var(--lichtgrijs); }
  label.keuze input { flex: none; margin: 2px 0 0; width: 19px; height: 19px; accent-color: var(--zwart); }
  label.keuze .naam { flex: 1; min-width: 0; color: var(--zwart); }
  label.keuze .sub { display: block; font-size: 12px; color: #6f7679; font-weight: 400; }
  label.keuze.aan .naam { font-weight: 700; }
  label.keuze .bedrag {
    flex: none; margin-left: auto; padding-left: 10px;
    font-variant-numeric: tabular-nums; color: var(--donkergrijs); white-space: nowrap;
  }

  .veld { margin-bottom: 12px; }
  .veld > span { display: block; font-size: 12px; color: #6f7679; margin-bottom: 4px; }
  input[type="text"], input[type="date"], input[type="password"] {
    font: inherit; width: 100%; padding: 11px 12px;
    border: 1.5px solid var(--lijn); border-radius: 8px; background: #fff; color: var(--donkergrijs);
  }
  input:focus-visible, label.keuze:focus-within, .chip:focus-visible, button:focus-visible {
    outline: 3px solid var(--geel); outline-offset: 1px;
  }
  .rij { display: flex; gap: 10px; }
  .rij .veld { flex: 1; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 500; padding: 9px 15px; border-radius: 22px;
    border: 1.5px solid var(--lijn); background: #fff; color: var(--donkergrijs); cursor: pointer; flex: none;
  }
  .chip:hover { border-color: var(--zwart); }
  .chip.aan { background: var(--geel); border-color: var(--geel); color: var(--zwart); font-weight: 700; }
  .chip.klein { font-size: 12px; padding: 5px 11px; }

  .knoppen { display: flex; gap: 9px; margin-top: 24px; }
  button.hoofd, button.terug, button.extra {
    flex: 1; padding: 14px; font: inherit; font-weight: 700; border: 0; border-radius: 10px;
    background: var(--geel); color: var(--zwart); cursor: pointer;
  }
  button.terug { background: var(--blauwgrijs); color: var(--donkergrijs); }
  button.extra { background: #fff; color: var(--zwart); border: 1.5px solid var(--lijn); font-weight: 500; padding: 11px; }
  button:disabled { opacity: .35; cursor: default; }
  .melding { color: #a3231f; font-size: 13px; margin-top: 13px; }

  .totaalbalk {
    position: sticky; bottom: 0;
    display: flex; justify-content: space-between; align-items: center;
    margin: 18px -20px -24px; padding: 14px 20px;
    background: var(--zwart); color: #fff; font-size: 13px;
    border-radius: 0 0 14px 14px;
  }
  .totaalbalk b { font-size: 20px; color: var(--geel); font-variant-numeric: tabular-nums; }

  .kop { border-bottom: 4px solid var(--geel); padding-bottom: 12px; margin-bottom: 16px; }
  .kop h3 { margin: 0 0 3px; font-size: 21px; color: var(--zwart); font-weight: 700; }
  .kop .meta { font-size: 13px; color: #6f7679; }

  table.lijst { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.lijst tr.sectie th {
    text-align: left; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--zwart); padding: 16px 0 5px;
  }
  table.lijst td { padding: 7px 0; border-top: 1px solid var(--lijn); vertical-align: top; color: var(--donkergrijs); }
  table.lijst td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 10px; }
  table.lijst tr.eind td {
    border-top: 3px solid var(--geel); font-weight: 700; font-size: 15px;
    padding-top: 11px; color: var(--zwart);
  }
  .leeg { font-size: 13px; color: #6f7679; }

  .uitkomst {
    text-align: center; padding: 22px 12px; margin-top: 20px;
    background: var(--geel); border-radius: 12px;
  }
  .uitkomst .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--zwart); font-weight: 700; }
  .uitkomst .bedrag {
    font-size: 42px; font-weight: 800; letter-spacing: -.03em; margin: 6px 0 0;
    font-variant-numeric: tabular-nums; color: var(--zwart);
  }

  .vergelijk { display: flex; gap: 8px; margin-top: 12px; }
  .vergelijk div {
    flex: 1; border: 1.5px solid var(--lijn); border-radius: 10px; padding: 11px 8px; text-align: center;
    background: #fff;
  }
  .vergelijk div.aan { border-color: var(--geel); background: var(--geel-tint); }
  .vergelijk .n { font-size: 12px; color: #6f7679; }
  .vergelijk .b { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; color: var(--zwart); }

  .beheerlink { margin: 18px 0 0; }
  .prijskop, .prijsrij {
    display: grid; grid-template-columns: 1fr 74px 74px 74px; gap: 6px; align-items: center;
  }
  .prijskop {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: #6f7679; margin-bottom: 4px; text-align: center;
  }
  .prijskop span:first-child { text-align: left; }
  .prijsrij { padding: 4px 0; border-top: 1px solid var(--lijn); }
  .prijsnaam { font-size: 13px; color: var(--zwart); }
  .prijsrij input {
    font: inherit; font-size: 13px; width: 100%; padding: 7px 8px; text-align: right;
    border: 1.5px solid var(--lijn); border-radius: 7px; background: #fff;
    color: var(--donkergrijs); font-variant-numeric: tabular-nums;
  }
  @media (max-width: 560px) {
    .prijskop, .prijsrij { grid-template-columns: 1fr 60px 60px 60px; gap: 4px; }
    .prijsnaam { font-size: 12px; }
  }
  .kleine-letters { font-size: 12px; color: #6f7679; margin-top: 18px; }
  .voet {
    margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--lijn);
    font-size: 11px; color: #6f7679; line-height: 1.6;
  }

  @media (max-width: 480px) {
    .rij { display: block; }
    .vergelijk { flex-wrap: wrap; }
    .uitkomst .bedrag { font-size: 34px; }
  }
  @media print {
    @page { size: A4; margin: 15mm 14mm 14mm; }
    body { background: #fff; padding: 0; font-size: 10.5pt; color: #000; }
    .app { max-width: none; }
    h1, .ondertitel { display: none; }
    .rail, .knoppen, .stapnr, .uitleg, .melding, .noprint { display: none !important; }
    .box { box-shadow: none; padding: 0; border-radius: 0; }
    .merkbalk { margin-bottom: 10px; }
    table.lijst { page-break-inside: auto; }
    table.lijst tr { page-break-inside: avoid; }
    table.lijst tr.sectie th { page-break-after: avoid; }
    .uitkomst, .voet { page-break-inside: avoid; }
    .uitkomst { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="merkbalk">
    <img id="logo" class="logobeeld" alt="Jouw Droombadkamer" hidden>
    <div class="woordmerk" id="woordmerk"><span>Jouw droom</span><span>badkamer</span></div>
  </div>
  <h1>Sanitair samenstellen</h1>
  <p class="ondertitel">Stel je badkamer samen en zie direct wat het kost.</p>
  <div class="rail" id="rail"></div>
  <div class="box" id="scherm"></div>
</div>

/* ========================================================================== */

function leeg() {
  return {
    klant: "", project: "", datum: new Date().toISOString().slice(0, 10),
    type: "", niveau: 1, san: {}, beheer: false, wachtwoord: "", slotfout: false
  };
}

var S = leeg();
var stap = 0;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function euro(n) {
  return "\u20ac " + Number(n).toLocaleString("nl-NL", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function vind(lijst, id) {
  for (var i = 0; i < lijst.length; i++) if (lijst[i].id === id) return lijst[i];
  return null;
}

/* ---------- rekenen ---------- */

function secties() {
  var uit = [];
  for (var i = 0; i < SECTIES.length; i++) {
    if (S.type && SECTIES[i].types.indexOf(S.type) !== -1) uit.push(SECTIES[i]);
  }
  return uit;
}
function aan(it) {
  return it.keuze ? S.san[it.keuze] === it.id : !!S.san[it.id];
}
function blokReden(it) {
  if (it.nietBij) {
    for (var k in S.san) {
      if (S.san.hasOwnProperty(k) && S.san[k] === it.nietBij) return "Vervalt bij een douchecabine";
    }
  }
  if (it.alleenBij) {
    for (var i = 0; i < it.alleenBij.length; i++) {
      var b = zoekItem(it.alleenBij[i]);
      if (b && aan(b)) return "";
    }
    return it.nodig || "Nog niet beschikbaar";
  }
  return "";
}
function geblokkeerd(it) { return blokReden(it) !== ""; }

function zoekItem(id) {
  for (var i = 0; i < SECTIES.length; i++) {
    for (var j = 0; j < SECTIES[i].items.length; j++) {
      if (SECTIES[i].items[j].id === id) return SECTIES[i].items[j];
    }
  }
  return null;
}
function aantal(it) {
  return (it.x2 && S.san.wastafel === "wastafel_dubbel") ? 2 : 1;
}
function prijs(it, niveau) {
  return it.p[niveau === undefined ? S.niveau : niveau] * aantal(it);
}
function gekozen() {
  var uit = [], lijst = secties();
  for (var i = 0; i < lijst.length; i++) {
    var items = lijst[i].items;
    for (var j = 0; j < items.length; j++) {
      if (aan(items[j]) && !geblokkeerd(items[j])) {
        uit.push({ sectie: lijst[i].titel, item: items[j] });
      }
    }
  }
  return uit;
}
function totaal(niveau) {
  var g = gekozen(), t = 0;
  for (var i = 0; i < g.length; i++) t += prijs(g[i].item, niveau);
  return t;
}
function sectieTotaal(sec) {
  var t = 0;
  for (var i = 0; i < sec.items.length; i++) {
    if (aan(sec.items[i]) && !geblokkeerd(sec.items[i])) t += prijs(sec.items[i]);
  }
  return t;
}

/* ---------- stappen ---------- */

function stappen() {
  var uit = [{ id: "start", titel: "Ruimte en niveau" }];
  var lijst = secties();
  for (var i = 0; i < lijst.length; i++) uit.push({ id: lijst[i].id, titel: lijst[i].titel, sec: lijst[i] });
  uit.push({ id: "overzicht", titel: "Overzicht" });
  return uit;
}

/* ---------- bouwstenen ---------- */

function regel(o) {
  return '<label class="keuze' + (o.aan ? " aan" : "") + (o.uit ? " uit" : "") + '">'
       +   '<input type="' + o.type + '" name="' + esc(o.groep) + '" value="' + esc(o.id) + '"'
       +          ' data-rol="' + o.rol + '"' + (o.aan ? " checked" : "") + (o.uit ? " disabled" : "") + '>'
       +   '<span class="naam">' + esc(o.naam)
       +     (o.sub ? '<span class="sub">' + esc(o.sub) + '</span>' : '')
       +   '</span>'
       +   (o.bedrag === undefined ? '' : '<span class="bedrag">' + o.bedrag + '</span>')
       + '</label>';
}

function niveauChips(klein) {
  var h = '<div class="chips">';
  for (var n = 0; n < NIVEAUS.length; n++) {
    h += '<button type="button" class="chip' + (klein ? " klein" : "")
       + (S.niveau === NIVEAUS[n].id ? " aan" : "") + '"'
       + ' data-rol="niveau" data-val="' + NIVEAUS[n].id + '">' + esc(NIVEAUS[n].naam) + '</button>';
  }
  return h + '</div>';
}

/* ---------- schermen ---------- */

function schermStart() {
  var h = '<fieldset><legend>Type ruimte</legend>';
  for (var i = 0; i < TYPES.length; i++) {
    h += regel({ type: "radio", groep: "type", rol: "type", id: TYPES[i].id,
                 aan: S.type === TYPES[i].id,
                 naam: "Type " + TYPES[i].id, sub: TYPES[i].naam });
  }
  h += '</fieldset>';

  h += '<fieldset><legend>Niveau</legend>' + niveauChips()
     + '<p class="uitleg" style="margin:4px 0 0">Geldt voor alle artikelen. '
     + 'Je kunt het later nog wisselen; je keuzes blijven staan.</p></fieldset>';

  h += '<fieldset><legend>Gegevens (optioneel)</legend>'
     + '<div class="rij">'
     +   '<label class="veld"><span>Naam klant</span><input type="text" data-rol="veld" data-veld="klant" value="' + esc(S.klant) + '"></label>'
     +   '<label class="veld"><span>Project</span><input type="text" data-rol="veld" data-veld="project" value="' + esc(S.project) + '"></label>'
     + '</div>'
     + '<label class="veld"><span>Datum</span><input type="date" data-rol="veld" data-veld="datum" value="' + esc(S.datum) + '"></label>'
     + '</fieldset>'
     + '<p class="beheerlink noprint">'
     +   '<button type="button" class="chip klein" id="beheeropen">Prijzen aanpassen</button>'
     + '</p>';
  return h;
}

function schermSectie(sec) {
  var h = niveauChips(true), huidigeGroep = null, open = false;

  for (var i = 0; i < sec.items.length; i++) {
    var it = sec.items[i], blok = geblokkeerd(it), n = aantal(it);

    if (it.groep !== huidigeGroep) {
      if (open) h += '</fieldset>';
      huidigeGroep = it.groep;
      h += '<fieldset>' + (huidigeGroep ? '<legend>' + esc(huidigeGroep) + '</legend>' : '');
      open = true;
    }

    var sub = it.sub || "";
    if (blok) sub = blokReden(it);
    else if (n > 1) sub = (sub ? sub + " \u00b7 " : "") + "2\u00d7 vanwege de dubbele wastafel";

    h += regel({
      type: it.keuze ? "radio" : "checkbox",
      groep: it.keuze ? "k_" + it.keuze : "v_" + it.id,
      rol: it.keuze ? "keuze" : "vink",
      id: it.keuze ? it.keuze + "|" + it.id : it.id,
      aan: aan(it) && !blok,
      uit: blok,
      naam: it.naam,
      sub: sub,
      bedrag: it.p[S.niveau] ? euro(prijs(it)) : undefined
    });

    /* laatste artikel van deze groep: wisknop voor de gemaakte keuzes */
    var laatste = (i === sec.items.length - 1) || (sec.items[i + 1].groep !== huidigeGroep);
    if (laatste) {
      var keuzes = [];
      for (var j = 0; j < sec.items.length; j++) {
        var x = sec.items[j];
        if (x.groep === huidigeGroep && x.keuze && S.san[x.keuze]
            && keuzes.indexOf(x.keuze) === -1) keuzes.push(x.keuze);
      }
      if (keuzes.length) {
        h += '<div class="chips" style="margin:2px 0 0">'
           +   '<button type="button" class="chip klein" data-rol="wis" data-keuzes="'
           +     esc(keuzes.join(",")) + '">Keuze wissen</button>'
           + '</div>';
      }
    }
  }
  if (open) h += '</fieldset>';

  h += '<div class="totaalbalk">'
     +   '<span>' + esc(sec.titel) + ' ' + euro(sectieTotaal(sec)) + ' \u00b7 totaal</span>'
     +   '<b>' + euro(totaal()) + '</b>'
     + '</div>';
  return h;
}

function schermOverzicht() {
  var h = '<div class="kop">'
        +   '<h3>' + esc(S.project || "Sanitair") + '</h3>'
        +   '<div class="meta">'
        +     esc(S.datum)
        +     (S.klant ? " &middot; " + esc(S.klant) : "")
        +     (S.type ? "<br>Type " + esc(S.type) + " \u2014 " + esc(vind(TYPES, S.type).naam) : "")
        +     " &middot; niveau " + esc(vind(NIVEAUS, S.niveau).naam)
        +   '</div>'
        + '</div>';

  var lijst = secties(), rijen = "";
  for (var i = 0; i < lijst.length; i++) {
    var sec = lijst[i], blok = "";
    for (var j = 0; j < sec.items.length; j++) {
      var it = sec.items[j];
      if (!aan(it) || geblokkeerd(it) || !prijs(it)) continue;
      blok += '<tr><td>' + esc(it.naam) + (aantal(it) > 1 ? " (2\u00d7)" : "") + '</td>'
            + '<td class="num">' + euro(prijs(it)) + '</td></tr>';
    }
    if (blok) rijen += '<tr class="sectie"><th colspan="2">' + esc(sec.titel) + '</th></tr>' + blok;
  }

  if (!rijen) {
    h += '<p class="leeg">Er is nog niets gekozen. Ga terug en stel het sanitair samen.</p>';
    return h;
  }

  h += '<table class="lijst">' + rijen
     + '<tr class="eind"><td>Totaal inclusief btw</td><td class="num">' + euro(totaal()) + '</td></tr>'
     + '</table>';

  h += '<div class="uitkomst"><div class="label">Totaal ' + esc(vind(NIVEAUS, S.niveau).naam) + '</div>'
     +   '<p class="bedrag">' + euro(totaal()) + '</p></div>';

  h += '<p class="uitleg noprint" style="margin:18px 0 0">Zelfde keuzes op een ander niveau:</p>'
     + '<div class="vergelijk noprint">';
  for (var n = 0; n < NIVEAUS.length; n++) {
    h += '<div class="' + (S.niveau === NIVEAUS[n].id ? "aan" : "") + '">'
       +   '<div class="n">' + esc(NIVEAUS[n].naam) + '</div>'
       +   '<div class="b">' + euro(totaal(NIVEAUS[n].id)) + '</div>'
       + '</div>';
  }
  h += '</div>' + '<div style="margin-top:12px" class="noprint">' + niveauChips(true) + '</div>';

  h += '<p class="kleine-letters">Alle bedragen zijn inclusief btw. '
     + 'Prijzen zijn indicatief en gelden voor het genoemde niveau.</p>'
     + '<div class="voet"><strong>' + esc(BEDRIJF.naam) + '</strong><br>'
     +   esc(BEDRIJF.adres) + ' &middot; ' + esc(BEDRIJF.telefoon) + '<br>'
     +   esc(BEDRIJF.email) + ' &middot; ' + esc(BEDRIJF.web)
     + '</div>';

  h += '<div class="knoppen noprint">'
     +   '<button type="button" class="hoofd" id="pdf">Download pdf</button>'
     + '</div>';
  return h;
}

/* ---------- prijzen beheren ----------
   Een apart scherm waarin alle prijzen als invulveld staan. Wijzigingen
   werken meteen in de tool. Met de downloadknop maak je een nieuw
   index.html waarin de nieuwe prijzen vastliggen. ------------------------ */

/* Het wachtwoord staat niet als tekst in het bestand, maar als controlegetal.
   Nieuw wachtwoord? Reken de waarde uit met dezelfde formule en zet hem hier. */
var SLEUTEL = 108360;

function sleutelVan(tekst) {
  var h = 0;
  for (var i = 0; i < tekst.length; i++) {
    h = (h * 31 + tekst.charCodeAt(i) * (i + 1)) % 1000000007;
  }
  return h;
}

function schermSlot() {
  return '<p class="uitleg">Het aanpassen van prijzen is afgeschermd. '
       + 'Vul het wachtwoord in om verder te gaan.</p>'
       + '<fieldset><label class="veld"><span>Wachtwoord</span>'
       +   '<input type="password" id="wachtwoord" data-rol="wachtwoord" autocomplete="off"'
       +          ' value="' + esc(S.wachtwoord) + '"></label></fieldset>'
       + (S.slotfout ? '<p class="melding" style="margin-top:-6px">Dat wachtwoord klopt niet.</p>' : '')
       + '<div class="knoppen noprint">'
       +   '<button type="button" class="terug" id="slotterug">Terug</button>'
       +   '<button type="button" class="hoofd" id="slotopen">Verder</button>'
       + '</div>';
}

function slotProberen() {
  if (sleutelVan(S.wachtwoord) === SLEUTEL) {
    S.beheer = "open";
    S.wachtwoord = "";
    S.slotfout = false;
  } else {
    S.slotfout = true;
  }
  render();
}

function schermPrijzen() {
  var h = '<p class="uitleg">Pas hier de bedragen aan. Ze werken direct in de tool. '
        + 'Wil je ze bewaren, download dan onderaan het nieuwe bestand.</p>';

  for (var i = 0; i < SECTIES.length; i++) {

       + '<div class="prijskop"><span></span><span>Budget</span><span>Comfort</span><span>Luxe</span></div>';
    for (var j = 0; j < sec.items.length; j++) {
      var it = sec.items[j];
      h += '<div class="prijsrij"><span class="prijsnaam">' + esc(it.naam) + '</span>';
      for (var n = 0; n < 3; n++) {
        h += '<input type="number" step="1" min="0" inputmode="numeric"'

           +   ' value="' + it.p[n] + '">';

  }

     + '</div>'

     + 'Upload het op GitHub over het bestaande bestand heen, dan gelden de nieuwe prijzen voor iedereen.</p>';
  return h;
}

/* Nieuw bestand samenstellen met de huidige prijzen erin verwerkt. */
function bestandMetPrijzen() {
  var scherm = document.getElementById("scherm");
  var bewaard = scherm.innerHTML;
  scherm.innerHTML = "";                       /* schermvulling niet meebakken */
  var bron = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  scherm.innerHTML = bewaard;

  for (var i = 0; i < SECTIES.length; i++) {
    for (var j = 0; j < SECTIES[i].items.length; j++) {
      var it = SECTIES[i].items[j];
      var zoek = new RegExp('(id:\\s*"' + it.id + '"[^}]*?p:\\s*\\[)[^\\]]*(\\])');
      bron = bron.replace(zoek, "$1" + it.p.join(", ") + "$2");
    }
  }
  return bron;
}

function downloadBestand(inhoud, naam, soort) {
  var blob = new Blob([inhoud], { type: soort });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = naam;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

/* ---------- weergave ---------- */

function toonFouten() {
  var knop = document.getElementById("verder");
  var melding = document.getElementById("melding");
  var fout = (stap === 0 && !S.type) ? "Kies eerst een type ruimte." : "";
  if (knop) knop.disabled = !!fout;
  if (melding) {
    melding.textContent = fout;
    melding.style.display = fout ? "block" : "none";
  }
}

function opschonen() {
  for (var i = 0; i < SECTIES.length; i++) {
    for (var j = 0; j < SECTIES[i].items.length; j++) {
      var it = SECTIES[i].items[j];
      if (!it.alleenBij || !geblokkeerd(it)) continue;
      if (it.keuze) { if (S.san[it.keuze] === it.id) S.san[it.keuze] = ""; }
      else if (S.san[it.id]) S.san[it.id] = false;
    }
  }
}

function render() {
  if (S.beheer) {
    var slot = S.beheer !== "open";
    document.getElementById("rail").innerHTML = "";
    document.getElementById("scherm").innerHTML =
        '<div class="stapnr">Beheer</div><h2>Prijzen</h2>'
      + (slot ? schermSlot() : schermPrijzen());
    if (slot) {
      var veld = document.getElementById("wachtwoord");
      if (veld) { veld.focus(); }
    }
    return;
  }

  opschonen();
  var st = stappen();
  if (stap >= st.length) stap = st.length - 1;
  var huidig = st[stap], rail = "";
  for (var i = 0; i < st.length; i++) rail += '<i class="' + (i <= stap ? "done" : "") + '"></i>';
  document.getElementById("rail").innerHTML = rail;

  var inhoud;
  if (huidig.id === "start") inhoud = schermStart();
  else if (huidig.id === "overzicht") inhoud = schermOverzicht();
  else inhoud = schermSectie(huidig.sec);

  document.getElementById("scherm").innerHTML =
      '<div class="stapnr">Stap ' + (stap + 1) + ' van ' + st.length + '</div>'
    + '<h2>' + esc(huidig.titel) + '</h2>'
    + inhoud
    + '<div class="knoppen noprint">'
    +   '<button type="button" class="terug" id="terug"' + (stap === 0 ? " disabled" : "") + '>Terug</button>'
    +   (stap < st.length - 1
          ? '<button type="button" class="hoofd" id="verder">Verder</button>'
          : '<button type="button" class="hoofd" id="opnieuw">Opnieuw beginnen</button>')
    + '</div>'
    + '<div class="melding" id="melding" style="display:none"></div>';

  toonFouten();
}

  975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,
  667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,
  333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,
  611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
var EXTRA_BREEDTE = { 128: 556, 145: 222, 146: 222, 147: 333, 148: 333,
                      150: 556, 151: 1000, 183: 278, 215: 584 };
/* letters met accent even breed als de kale letter */
var GRONDLETTER = { 224:97,225:97,226:97,227:97,228:97,229:97,231:99,232:101,233:101,
                    234:101,235:101,236:105,237:105,238:105,239:105,241:110,242:111,
                    243:111,244:111,245:111,246:111,249:117,250:117,251:117,252:117 };
/* tekens die in een pdf een andere code hebben dan in de browser */
var HERCODERING = { 8364: 128, 8216: 145, 8217: 146, 8220: 147, 8221: 148,
                    8211: 150, 8212: 151, 8226: 149 };

function pdfCode(teken) {
  var c = teken.charCodeAt(0);
  if (HERCODERING[c]) return HERCODERING[c];
  return c < 256 ? c : 63;               /* onbekend teken wordt een vraagteken */
}

function tekenBreedte(code, vet) {
  if (EXTRA_BREEDTE[code] !== undefined) return EXTRA_BREEDTE[code];
  if (GRONDLETTER[code] !== undefined) code = GRONDLETTER[code];
  if (code < 32 || code > 126) return 556;
  return (vet ? BREEDTE_VET : BREEDTE_GEWOON)[code - 32];
}

function tekstBreedte(tekst, grootte, vet) {
  var som = 0;
  for (var i = 0; i < tekst.length; i++) som += tekenBreedte(pdfCode(tekst[i]), vet);
  return som / 1000 * grootte / MM;      /* terug naar millimeter */
}

function pdfTekst(tekst) {
  var uit = "";
  for (var i = 0; i < tekst.length; i++) {
    var c = pdfCode(tekst[i]);
    if (c === 40 || c === 41 || c === 92) uit += "\\" + String.fromCharCode(c);
    else if (c < 32 || c > 126) uit += "\\" + ("00" + c.toString(8)).slice(-3);
    else uit += String.fromCharCode(c);
  }
  return uit;
}

function breekAf(tekst, maxBreedte, grootte, vet) {
  var woorden = tekst.split(" "), regels = [], regel = "";
  for (var i = 0; i < woorden.length; i++) {
    var poging = regel ? regel + " " + woorden[i] : woorden[i];
    if (regel && tekstBreedte(poging, grootte, vet) > maxBreedte) {
      regels.push(regel);
      regel = woorden[i];
    } else {
      regel = poging;
    }
  }
  if (regel) regels.push(regel);
  return regels;
}

/* ---------- tekenen ---------- */

function PdfDocument() {
  this.paginas = [];
  this.huidig = null;
}
PdfDocument.prototype.nieuwePagina = function () {
  this.huidig = [];
  this.paginas.push(this.huidig);
};
PdfDocument.prototype.op = function (regel) { this.huidig.push(regel); };

PdfDocument.prototype.vlak = function (x, y, breed, hoog, kleur) {
  this.op(kleurCode(kleur) + " rg " + pt(x) + " " + ptY(y + hoog) + " "
          + pt(breed) + " " + pt(hoog) + " re f");
};
PdfDocument.prototype.lijn = function (x1, y1, x2, y2, kleur, dikte) {
  this.op(kleurCode(kleur) + " RG " + pt(dikte) + " w "
          + pt(x1) + " " + ptY(y1) + " m " + pt(x2) + " " + ptY(y2) + " l S");
};
PdfDocument.prototype.kader = function (x, y, breed, hoog, kleur, dikte) {
  this.op(kleurCode(kleur) + " RG " + pt(dikte) + " w " + pt(x) + " " + ptY(y + hoog)
          + " " + pt(breed) + " " + pt(hoog) + " re S");
};
PdfDocument.prototype.tekst = function (tekst, x, y, opties) {
  var o = opties || {};
  var grootte = o.grootte || 10, vet = !!o.vet, kleur = o.kleur || [0, 0, 0];
  var plek = x;
  if (o.rechts) plek = x - tekstBreedte(tekst, grootte, vet);
  else if (o.midden) plek = x - tekstBreedte(tekst, grootte, vet) / 2;
  this.op("BT " + kleurCode(kleur) + " rg /" + (vet ? "F2" : "F1") + " " + grootte
          + " Tf 1 0 0 1 " + pt(plek) + " " + ptY(y) + " Tm (" + pdfTekst(tekst) + ") Tj ET");
};
PdfDocument.prototype.afbeelding = function (x, y, breed, hoog) {
  this.op("q " + pt(breed) + " 0 0 " + pt(hoog) + " " + pt(x) + " " + ptY(y + hoog) + " cm /Im0 Do Q");
};

function pt(mm) { return (mm * MM).toFixed(2); }
function ptY(mm) { return ((PAGINA.hoog - mm) * MM).toFixed(2); }
function kleurCode(k) {
  return (k[0] / 255).toFixed(3) + " " + (k[1] / 255).toFixed(3) + " " + (k[2] / 255).toFixed(3);
}

/* ---------- afbeelding uit de base64-logo halen ---------- */

function pngGegevens(dataUrl) {
  var ruw = atob(dataUrl.split(",")[1]);
  var lees = function (p) {
    return (ruw.charCodeAt(p) << 24 | ruw.charCodeAt(p + 1) << 16
            | ruw.charCodeAt(p + 2) << 8 | ruw.charCodeAt(p + 3)) >>> 0;
  };
  var i = 8, breed = 0, hoog = 0, kleurtype = 0, data = "";
  while (i < ruw.length) {
    var lengte = lees(i), soort = ruw.substr(i + 4, 4);
    if (soort === "IHDR") {
      breed = lees(i + 8);
      hoog = lees(i + 12);
      kleurtype = ruw.charCodeAt(i + 17);
    } else if (soort === "IDAT") {
      data += ruw.substr(i + 8, lengte);
    } else if (soort === "IEND") break;
    i += 12 + lengte;
  }
  if (kleurtype !== 2 && kleurtype !== 0) return null;   /* alleen rgb of grijs */
  return { breed: breed, hoog: hoog, kleuren: kleurtype === 2 ? 3 : 1, data: data };
}

/* ---------- het bestand samenstellen ---------- */

function pdfBytes(doc, plaatje) {
  var objecten = [], uit = "%PDF-1.4\n";
  function voegToe(inhoud) { objecten.push(inhoud); return objecten.length; }

  var nCatalog = voegToe(null), nPages = voegToe(null);
  var nGewoon = voegToe("<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>");
  var nVet = voegToe("<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>");

  var nPlaatje = 0;
  if (plaatje) {
    nPlaatje = voegToe("<</Type/XObject/Subtype/Image/Width " + plaatje.breed
      + "/Height " + plaatje.hoog + "/ColorSpace/" + (plaatje.kleuren === 3 ? "DeviceRGB" : "DeviceGray")
      + "/BitsPerComponent 8/Filter/FlateDecode/DecodeParms<</Predictor 15/Colors "
      + plaatje.kleuren + "/BitsPerComponent 8/Columns " + plaatje.breed + ">>/Length "
      + plaatje.data.length + ">>\nstream\n" + plaatje.data + "\nendstream");
  }

  var paginaNrs = [];
  for (var p = 0; p < doc.paginas.length; p++) {
    var stroom = doc.paginas[p].join("\n");
    var nInhoud = voegToe("<</Length " + stroom.length + ">>\nstream\n" + stroom + "\nendstream");
    var bronnen = "<</Font<</F1 " + nGewoon + " 0 R/F2 " + nVet + " 0 R>>"
                + (nPlaatje ? "/XObject<</Im0 " + nPlaatje + " 0 R>>" : "") + ">>";
    paginaNrs.push(voegToe("<</Type/Page/Parent " + nPages + " 0 R/MediaBox[0 0 "
      + (PAGINA.breed * MM).toFixed(2) + " " + (PAGINA.hoog * MM).toFixed(2) + "]/Resources "
      + bronnen + "/Contents " + nInhoud + " 0 R>>"));
  }

  var kids = paginaNrs.map(function (n) { return n + " 0 R"; }).join(" ");
  objecten[nCatalog - 1] = "<</Type/Catalog/Pages " + nPages + " 0 R>>";
  objecten[nPages - 1] = "<</Type/Pages/Kids[" + kids + "]/Count " + paginaNrs.length + ">>";

  var plekken = [];
  for (var o = 0; o < objecten.length; o++) {
    plekken.push(uit.length);
    uit += (o + 1) + " 0 obj\n" + objecten[o] + "\nendobj\n";
  }
  var kruis = uit.length;
  uit += "xref\n0 " + (objecten.length + 1) + "\n0000000000 65535 f \n";
  for (var k = 0; k < plekken.length; k++) {
    uit += ("0000000000" + plekken[k]).slice(-10) + " 00000 n \n";
  }
  uit += "trailer\n<</Size " + (objecten.length + 1) + "/Root " + nCatalog
       + " 0 R>>\nstartxref\n" + kruis + "\n%%EOF";

  var bytes = new Uint8Array(uit.length);
  for (var b = 0; b < uit.length; b++) bytes[b] = uit.charCodeAt(b) & 0xff;
  return bytes;
}

function bestandsnaam() {
  var basis = (S.project || S.klant || "sanitair").toLowerCase()
                .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return "sanitair-" + (basis || "offerte") + "-" + S.datum + ".pdf";
}

function maakPdf() {
  var geel = KLEUR.geel, zwart = KLEUR.zwart, grijs = KLEUR.donkergrijs, lijnkleur = KLEUR.blauwgrijs;
  var L = 16, R = 194, y = 0;
  var doc = new PdfDocument();
  var plaatje = null;
  try { plaatje = pngGegevens(LOGO); } catch (fout) { plaatje = null; }

  function kop(eerste) {
    doc.nieuwePagina();
    var hoogte = eerste ? 15 : 9;
    var boven = eerste ? 14 : 8;
    if (plaatje) doc.afbeelding(L, boven, hoogte * LOGO_VERHOUDING, hoogte);
    else {
      doc.tekst("JOUW DROOM", L, boven + (eerste ? 6.5 : 4.5), { vet: true, grootte: eerste ? 13 : 10 });
      doc.tekst("BADKAMER", L, boven + (eerste ? 13 : 9), { vet: true, grootte: eerste ? 13 : 10 });
    }

    if (eerste) {
      doc.tekst(S.project || "Sanitair", R, 19, { vet: true, grootte: 19, rechts: true });
      var m = [];
      if (S.klant) m.push(S.klant);
      m.push(S.datum);
      doc.tekst(m.join("   \u00b7   "), R, 25, { grootte: 9.5, kleur: grijs, rechts: true });
      var t = vind(TYPES, S.type);
      doc.tekst("Type " + S.type + " \u2014 " + (t ? t.naam : "") + "   \u00b7   niveau "
                + vind(NIVEAUS, S.niveau).naam, R, 30.5, { grootte: 9.5, kleur: grijs, rechts: true });
    }
    doc.vlak(0, eerste ? 36 : 21, PAGINA.breed, eerste ? 4 : 2.5, geel);
    y = eerste ? 52 : 33;
  }
  function ruimte(mm) { if (y + mm > 262) kop(false); }

  kop(true);

  var lijst = secties();
  for (var i = 0; i < lijst.length; i++) {
    var sec = lijst[i], regels = [];
    for (var j = 0; j < sec.items.length; j++) {
      var it = sec.items[j];
      if (!aan(it) || geblokkeerd(it) || !prijs(it)) continue;
      regels.push(it);
    }
    if (!regels.length) continue;

    ruimte(18);
    doc.vlak(L, y - 3.6, 3, 4.6, geel);
    doc.tekst(sec.titel.toUpperCase(), L + 6, y, { vet: true, grootte: 8.5 });
    y += 6;

    for (var k = 0; k < regels.length; k++) {
      var naam = regels[k].naam + (aantal(regels[k]) > 1 ? " (2\u00d7)" : "");
      var stukken = breekAf(naam, 128, 10, false);
      ruimte(4.6 * stukken.length + 3);
      doc.lijn(L, y - 3.8, R, y - 3.8, lijnkleur, 0.15);
      for (var r = 0; r < stukken.length; r++) {
        doc.tekst(stukken[r], L, y + r * 4.4, { grootte: 10, kleur: grijs });
      }
      doc.tekst(euro(prijs(regels[k])), R, y, { vet: true, grootte: 10, rechts: true });
      y += 6.6 + (stukken.length - 1) * 4.4;
    }
    y += 4;
  }

  /* totaal */
  ruimte(24);
  y += 2;
  doc.vlak(L, y, R - L, 15, zwart);
  doc.tekst("Totaal inclusief btw", L + 6, y + 9.5, { vet: true, grootte: 11, kleur: [255, 255, 255] });
  doc.tekst(euro(totaal()), R - 6, y + 10, { vet: true, grootte: 15, kleur: geel, rechts: true });

  /* voet op elke pagina */
  var totaalPaginas = doc.paginas.length;
  for (var p = 0; p < totaalPaginas; p++) {
    doc.huidig = doc.paginas[p];
    doc.lijn(L, 281, R, 281, geel, 1.2);
    doc.tekst(BEDRIJF.naam, L, 286, { vet: true, grootte: 7.5 });
    doc.tekst(BEDRIJF.adres + "   \u00b7   " + BEDRIJF.telefoon + "   \u00b7   " + BEDRIJF.web,
              L, 290, { grootte: 7.5, kleur: grijs });
    doc.tekst("Alle bedragen inclusief btw. Prijzen zijn indicatief.", R, 286,
              { grootte: 7.5, kleur: grijs, rechts: true });
    doc.tekst((p + 1) + " / " + totaalPaginas, R, 290, { grootte: 7.5, kleur: grijs, rechts: true });
  }

  var blob = new Blob([pdfBytes(doc, plaatje)], { type: "application/pdf" });
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = bestandsnaam();
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  return true;
}

/* ---------- interactie ---------- */

document.addEventListener("change", function (e) {
  var rol = e.target.getAttribute("data-rol");
  if (!rol) return;
  var id = e.target.value;

  if (rol === "veld") {
    S[e.target.getAttribute("data-veld")] = e.target.value;
  } else if (rol === "type") {
    S.type = id;
  } else if (rol === "keuze") {
    var deel = id.split("|");
    S.san[deel[0]] = deel[1];
  } else if (rol === "vink") {
    S.san[id] = e.target.checked;
  } else if (rol === "wachtwoord") {
    S.wachtwoord = e.target.value;
    return;
  } else if (rol === "prijsveld") {
    var stuk = zoekItem(e.target.getAttribute("data-item"));
    if (stuk) stuk.p[Number(e.target.getAttribute("data-niveau"))] = Number(e.target.value) || 0;
    return;                                  /* niet opnieuw tekenen: cursor blijft staan */
  }

  render();
});

document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  if (e.target.getAttribute && e.target.getAttribute("data-rol") === "wachtwoord") {
    S.wachtwoord = e.target.value;
    slotProberen();
  }
});

document.addEventListener("click", function (e) {
  var el = e.target, rol = el.getAttribute && el.getAttribute("data-rol");

  if (rol === "niveau") {
    S.niveau = Number(el.getAttribute("data-val"));
    render();
    return;
  }
  if (rol === "wis") {
    var groepen = el.getAttribute("data-keuzes").split(",");
    for (var i = 0; i < groepen.length; i++) S.san[groepen[i]] = "";
    render();
    return;
  }

  var id = el.id;
  if (id === "beheeropen") {
    S.beheer = true; S.wachtwoord = ""; S.slotfout = false;
    render(); window.scrollTo(0, 0); return;
  }
  if (id === "slotopen") {
    var veld = document.getElementById("wachtwoord");
    if (veld) S.wachtwoord = veld.value;
    slotProberen(); return;
  }
  if (id === "slotterug" || id === "beheerklaar") {
    S.beheer = false; S.wachtwoord = ""; S.slotfout = false;
    render(); window.scrollTo(0, 0); return;
  }
  if (id === "prijzenopslaan") {
    downloadBestand(bestandMetPrijzen(), "index.html", "text/html");
    el.textContent = "Gedownload";
    setTimeout(function () { el.textContent = "Bestand downloaden"; }, 2000);
    return;
  }
  if (id === "verder") {
    if (stap === 0 && !S.type) { toonFouten(); return; }
    stap++; render(); window.scrollTo(0, 0);
  }
  if (id === "terug" && stap > 0) { stap--; render(); window.scrollTo(0, 0); }
  if (id === "opnieuw") { S = leeg(); stap = 0; render(); window.scrollTo(0, 0); }
  if (id === "pdf") {
    try {
      maakPdf();
    } catch (fout) {
      el.textContent = "Er ging iets mis bij het maken van de pdf";
      setTimeout(function () { el.textContent = "Download pdf"; }, 2500);
    }
  }

});

/* Logo in de merkbalk van de tool. */
(function toonLogo() {
  var el = document.getElementById("logo"), woord = document.getElementById("woordmerk");
  if (!el || !LOGO) return;
  el.src = LOGO;
  el.hidden = false;
  if (woord) woord.style.display = "none";
})();

render();
</script>
